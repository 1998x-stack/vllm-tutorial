name: Validate vLLM tutorial

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate generated course manifest
        run: python3 scripts/build_course_data.py --check
      - name: Validate article structure and local assets
        run: python3 scripts/validate_articles.py
      - name: Run offline catalog tests
        run: node --test tests/offline-catalog.test.cjs
