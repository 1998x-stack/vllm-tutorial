name: Validate vLLM knowledge base
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_course_data.py --check
      - run: node --test tests/offline-catalog.test.cjs
      - run: python -m pytest -q
      - run: |
          python skills/olah-style-vllm-posts/scripts/browser_check.py posts/core-mechanisms/03-pagedattention-memory-management/index.html --output reports/pagedattention
          python skills/olah-style-vllm-posts/scripts/browser_check.py posts/core-mechanisms/05-continuous-batching/index.html --output reports/batching
          python skills/olah-style-vllm-posts/scripts/browser_check.py posts/production/17-observability-metrics/index.html --output reports/metrics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: reports/
          if-no-files-found: ignore
