<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">vLLM 模型加载的六层流水线</title>
<desc id="desc">先锁定模型仓库与 revision，再解析 config 和 architecture，准备 tokenizer 与 chat template，构造模型并加载权重，选择 dtype、量化 scheme 与 kernel，最后规划 KV Cache 和 Scheduler 运行预算。远程代码信任是独立的安全边界。</desc>
<defs>
 <marker id="arr07" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#47756d"/></marker>
</defs>
<rect width="1200" height="610" rx="24" fill="#fbfaf7"/>
<text x="52" y="55" font-family="Arial,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#1f3835">模型加载不是下载文件，而是一条有依赖的流水线</text>
<text x="52" y="87" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#60716c">每一步都有自己的失败类型；先定位阶段，再调整对应参数。</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect x="55" y="132" width="330" height="154" rx="17" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <circle cx="88" cy="166" r="20" fill="#147d73"/><text x="88" y="173" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
 <text x="122" y="173" font-size="20" font-weight="700" fill="#0d5e58">模型来源与版本</text>
 <text x="82" y="218" font-size="15" fill="#315d56">Hub ID / 本地路径</text>
 <text x="82" y="244" font-size="15" fill="#315d56">model / tokenizer / code revision</text>
 <path d="M385 208 H425" stroke="#47756d" stroke-width="3" marker-end="url(#arr07)"/>
 <rect x="440" y="132" width="330" height="154" rx="17" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <circle cx="473" cy="166" r="20" fill="#6d63a8"/><text x="473" y="173" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
 <text x="507" y="173" font-size="20" font-weight="700" fill="#51488c">配置与架构解析</text>
 <text x="467" y="218" font-size="15" fill="#625b91">config.json / architectures</text>
 <text x="467" y="244" font-size="15" fill="#625b91">vLLM registered model implementation</text>
 <path d="M770 208 H810" stroke="#47756d" stroke-width="3" marker-end="url(#arr07)"/>
 <rect x="825" y="132" width="320" height="154" rx="17" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <circle cx="858" cy="166" r="20" fill="#c66a46"/><text x="858" y="173" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
 <text x="892" y="173" font-size="20" font-weight="700" fill="#9c4d30">输入协议</text>
 <text x="852" y="218" font-size="15" fill="#87533f">Tokenizer / special tokens</text>
 <text x="852" y="244" font-size="15" fill="#87533f">Chat Template / multimodal inputs</text>
 <path d="M985 286 V326" stroke="#47756d" stroke-width="3" marker-end="url(#arr07)"/>
 <rect x="825" y="342" width="320" height="154" rx="17" fill="#fff" stroke="#b7cbc3" stroke-width="2"/>
 <circle cx="858" cy="376" r="20" fill="#53636b"/><text x="858" y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
 <text x="892" y="383" font-size="20" font-weight="700" fill="#264b45">模型与权重</text>
 <text x="852" y="428" font-size="15" fill="#53636b">构造 module / load checkpoint shards</text>
 <text x="852" y="454" font-size="15" fill="#53636b">weight mapping / post-processing</text>
 <path d="M825 418 H785" stroke="#47756d" stroke-width="3" marker-end="url(#arr07)"/>
 <rect x="440" y="342" width="330" height="154" rx="17" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <circle cx="473" cy="376" r="20" fill="#147d73"/><text x="473" y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">5</text>
 <text x="507" y="383" font-size="20" font-weight="700" fill="#0d5e58">精度与执行 Kernel</text>
 <text x="467" y="428" font-size="15" fill="#315d56">dtype / quantization method &amp; scheme</text>
 <text x="467" y="454" font-size="15" fill="#315d56">Attention / Linear backend</text>
 <path d="M440 418 H400" stroke="#47756d" stroke-width="3" marker-end="url(#arr07)"/>
 <rect x="55" y="342" width="330" height="154" rx="17" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <circle cx="88" cy="376" r="20" fill="#6d63a8"/><text x="88" y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6</text>
 <text x="122" y="383" font-size="20" font-weight="700" fill="#51488c">运行时预算</text>
 <text x="82" y="428" font-size="15" fill="#625b91">max_model_len / KV Cache budget</text>
 <text x="82" y="454" font-size="15" fill="#625b91">Scheduler / concurrency / serving</text>
</g>
<rect x="55" y="530" width="1090" height="48" rx="12" fill="#fff6df" stroke="#d5a24a"/>
<text x="80" y="560" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#80571a">独立安全边界：</text>
<text x="230" y="560" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#80571a">trust_remote_code 默认关闭；只有信任仓库代码时才考虑开启。</text>
</svg>