<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" viewBox="0 0 1200 660"><title id="svgtitle">Benchmark control variables and measurement plane</title><desc id="svgdesc">Workload controls model, tokenizer, hardware, prompt/output distributions, arrival rate, client concurrency and cold/warm cache. Measure TTFT, ITL, TPOT, E2E, successful request throughput and failures separately.</desc><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#557e75" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" rx="20" fill="#fbfaf7"/><text x="54" y="56" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#1b3834">Benchmark：先固定实验条件，再谈性能结果</text><rect x="54" y="105" width="250" height="105" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="179" y="145" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#264b45">模型与软件</text><text x="179" y="177" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">model SHA · quant · driver</text><rect x="348" y="105" width="250" height="105" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="473" y="145" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#264b45">请求负载</text><text x="473" y="177" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">prompt / output lengths</text><rect x="642" y="105" width="250" height="105" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="767" y="145" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#264b45">到达模式</text><text x="767" y="177" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">rate · burstiness · concurrency</text><rect x="936" y="105" width="250" height="105" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="1061" y="145" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#264b45">缓存状态</text><text x="1061" y="177" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">cold / warm / prefix</text><path d="M178 211 L178 274" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path d="M473 211 L473 274" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path d="M767 211 L767 274" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path d="M1060 211 L1060 274" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect x="52" y="285" width="1130" height="115" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="617" y="328" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#51488c">同一 vLLM 实例 / 同一测量客户端边界</text><text x="617" y="370" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#625b91">每次运行记录成功、失败、吞吐、P50 / P95 / P99 与版本</text><path d="M618 401 L618 445" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect x="80" y="457" width="234" height="107" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="197" y="501" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">TTFT</text><text x="197" y="533" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">首输出事件</text><rect x="356" y="457" width="234" height="107" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="1.8"/><text x="473" y="501" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">ITL / TPOT</text><text x="473" y="533" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">相邻输出与 token 均值</text><rect x="632" y="457" width="234" height="107" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="749" y="501" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">Output tok/s</text><text x="749" y="533" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">生成 Token 总量 / 秒</text><rect x="908" y="457" width="234" height="107" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="1.8"/><text x="1025" y="501" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">失败率</text><text x="1025" y="533" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="400" fill="#53636b">failed / total</text><text x="55" y="624" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#80571a">警惕：重复随机 Prompt 可能重用 Prefix Cache，A/B 的热冷缓存状态必须明确。</text></svg>
