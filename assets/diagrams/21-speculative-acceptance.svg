<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Speculative decoding draft verify acceptance trace</title><desc id="desc">The draft model proposes four tokens. Target model evaluates all draft positions in one verification. First two are accepted; third is rejected and corrected; later draft candidates are discarded. Acceptance is a contiguous prefix.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#47756d"/></marker></defs><rect width="1200" height="620" rx="24" fill="#fbfaf7"/><text x="53" y="52" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#1f3835">Speculative Decoding：提议、验证、连续接受</text><rect id="draft" x="53" y="94" width="240" height="105" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><text x="173" y="133" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#51488c">Draft</text><text x="173" y="169" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#625b91">cheap proposals × 4</text><rect id="target" x="373" y="94" width="238" height="105" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="492" y="133" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#0d5e58">Target</text><text x="492" y="169" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">parallel verification</text><path id="draft-to-target" d="M293 145 L370 145" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path id="target-to-accept" d="M611 145 L691 145" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="accept-prefix" x="710" y="94" width="432" height="105" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/><text x="926" y="130" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#80571a">Accept contiguous prefix</text><text x="926" y="162" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#80571a">reject → corrected sample → continue</text><text x="926" y="188" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="12" font-weight="normal" fill="#80571a">接受前缀后目标再产生 1 个 bonus token：E[L] = 1 + E[A]</text><text x="59" y="266" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#264b45">位置</text><text x="282" y="266" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="normal" fill="#264b45">1</text><text x="508" y="266" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="normal" fill="#264b45">2</text><text x="734" y="266" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="normal" fill="#264b45">3</text><text x="960" y="266" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="normal" fill="#264b45">4</text><rect id="pos-1" x="187" y="297" width="180" height="94" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><rect id="pos-2" x="413" y="297" width="180" height="94" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><rect id="pos-3" x="639" y="297" width="180" height="94" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><rect id="pos-4" x="865" y="297" width="180" height="94" rx="12" fill="#f3f6f4" stroke="#b7cbc3" stroke-width="2"/><text x="277" y="334" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#0d5e58">A</text><text x="503" y="334" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#0d5e58">B</text><text x="729" y="334" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#9c4d30">C</text><text x="955" y="334" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#53636b">D</text><text x="277" y="367" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#0d5e58">Accepted</text><text x="503" y="367" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#0d5e58">Accepted</text><text x="729" y="367" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#9c4d30">Rejected</text><text x="955" y="367" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#53636b">Discarded</text><path id="reject-to-correct" d="M729 400 L729 455" stroke="#c66a46" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="residual-box" x="543" y="467" width="382" height="66" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="734" y="493" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#9c4d30">从残差目标分布校正</text><text x="734" y="518" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#87533f">后续候选 D 不直接进入输出</text><text x="55" y="574" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#60716c">标准拒绝采样在理论上保持目标分布；不同优化方法的保证、数值与性能仍需单独核验。</text></svg>