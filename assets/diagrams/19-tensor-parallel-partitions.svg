<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Column and row parallel tensor partitions</title><desc id="desc">Two GPUs each compute local linear projections. Column parallelism concatenates outputs; row parallelism sums partial outputs with All-Reduce. The mathematical dimensions are labeled.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#47756d"/></marker></defs><rect width="1200" height="620" rx="24" fill="#fbfaf7"/><text x="54" y="52" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#1f3835">Tensor Parallelism：同一层，分片计算</text><text x="54" y="90" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#0d5e58">COLUMN PARALLEL — 输出维度分片</text><rect id="col-input" x="58" y="126" width="175" height="118" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><text x="145" y="161" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="normal" fill="#51488c">X [B,H]</text><text x="145" y="194" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#625b91">完整输入</text><path id="x-to-w" d="M233 186 L283 186" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="col-weight" x="290" y="115" width="320" height="145" rx="12" fill="#fff" stroke="#b7cbc3" stroke-width="2"/><text x="450" y="145" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="normal" fill="#264b45">W = [W₀ | W₁]</text><rect x="325" y="166" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="366" y="166" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="407" y="166" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="448" y="166" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="489" y="166" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="530" y="166" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="325" y="192" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="366" y="192" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="407" y="192" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="448" y="192" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="489" y="192" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><rect x="530" y="192" width="37" height="22" rx="3" fill="#e5f3ef" stroke="#b7cbc3" stroke-width="2"/><text x="450" y="248" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">按输出列切分</text><path id="w-to-gpu0" d="M610 186 H663" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path id="w-to-gpu1" d="M645 186 V262 H1027 V250" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="col-gpu0" x="670" y="126" width="192" height="118" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="766" y="157" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#0d5e58">GPU 0</text><text x="766" y="185" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="normal" fill="#264b45">Y₀ = X W₀</text><text x="766" y="215" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">[B, 2H]</text><text x="895" y="295" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" fill="#51488c">X 广播到各 rank，各自用分片 W 并行计算；下游需全量输出时 Y = [Y₀ | Y₁]（All-Gather）</text><rect id="col-gpu1" x="915" y="126" width="225" height="118" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="1027" y="157" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#0d5e58">GPU 1</text><text x="1027" y="185" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="normal" fill="#264b45">Y₁ = X W₁</text><text x="1027" y="215" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">[B, 2H]</text><text x="54" y="324" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#9c4d30">ROW PARALLEL — 输入维度分片</text><rect id="row-input" x="58" y="348" width="300" height="142" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/><text x="208" y="378" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#80571a">X = [X₀ | X₁]</text><text x="208" y="412" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="normal" fill="#264b45">W = [W₀ ; W₁]</text><text x="208" y="453" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">输入与权重按行对应切分</text><path id="row-to-gpus" d="M358 415 L418 415" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="row-ranks" x="430" y="347" width="245" height="142" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="552" y="384" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#9c4d30">GPU 0 + GPU 1</text><text x="552" y="421" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="normal" fill="#264b45">Z₀=X₀W₀</text><text x="552" y="454" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="normal" fill="#264b45">Z₁=X₁W₁</text><path id="gpus-to-allreduce" d="M675 415 L737 415" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="allreduce" x="750" y="347" width="390" height="142" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><text x="945" y="386" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#51488c">All-Reduce (SUM)</text><text x="945" y="426" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="normal" fill="#264b45">Y = Z₀ + Z₁</text><text x="945" y="456" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">每个 rank 得到合并结果</text><rect x="54" y="522" width="1088" height="62" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/><text x="75" y="550" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#80571a">计算被切分并不代表通信消失：TP 的收益由 GEMM 减少量与 collective 成本共同决定。</text><text x="75" y="573" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#80571a">实际内核可能采用 Reduce-Scatter / All-Gather、Sequence Parallel 等不同数据布局。</text></svg>