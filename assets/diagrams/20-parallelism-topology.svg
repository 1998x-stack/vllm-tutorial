<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">TP PP DP and EP partitioning topology</title><desc id="desc">Four diagrams compare tensor parallel matrix shards, pipeline stages across layers, independent data parallel request batches, and MoE expert routing with dispatch and combine.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#47756d"/></marker></defs><rect width="1200" height="620" rx="24" fill="#fbfaf7"/><text x="54" y="54" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#1f3835">同样是多 GPU，切分对象不同</text><text x="292" y="112" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#51488c">TP · 层内矩阵</text><text x="897" y="112" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#0d5e58">PP · 不同 Transformer 层</text><rect x="58" y="133" width="485" height="168" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><rect x="91" y="166" width="83" height="81" rx="6" fill="#cbc7e9" stroke="#9188ba" stroke-width="2"/><rect x="196" y="166" width="83" height="81" rx="6" fill="#dfdcef" stroke="#9188ba" stroke-width="2"/><rect x="301" y="166" width="83" height="81" rx="6" fill="#cbc7e9" stroke="#9188ba" stroke-width="2"/><rect x="406" y="166" width="83" height="81" rx="6" fill="#dfdcef" stroke="#9188ba" stroke-width="2"/><text x="133" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#51488c">Shard 1</text><text x="238" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#51488c">Shard 2</text><text x="343" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#51488c">Shard 3</text><text x="448" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#51488c">Shard 4</text><rect x="658" y="133" width="486" height="168" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><rect x="686" y="166" width="94" height="81" rx="6" fill="#d3eae2" stroke="#6eb6a8" stroke-width="2"/><rect x="797" y="166" width="94" height="81" rx="6" fill="#d3eae2" stroke="#6eb6a8" stroke-width="2"/><rect x="908" y="166" width="94" height="81" rx="6" fill="#d3eae2" stroke="#6eb6a8" stroke-width="2"/><rect x="1019" y="166" width="94" height="81" rx="6" fill="#d3eae2" stroke="#6eb6a8" stroke-width="2"/><text x="733" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#0d5e58">L1–12</text><text x="844" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#0d5e58">L13–24</text><text x="955" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#0d5e58">L25–36</text><text x="1066" y="207" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#0d5e58">L37–48</text><text x="294" y="284" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#51488c">同一层：分片 GEMM + collective</text><text x="899" y="284" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#0d5e58">逐阶段传递 activation（可能出现 bubble）</text><text x="292" y="354" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#9c4d30">DP · 复制副本</text><text x="897" y="354" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#80571a">EP · 分配 MoE Experts</text><rect x="58" y="370" width="485" height="172" rx="12" fi