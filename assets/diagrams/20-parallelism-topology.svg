g SC',sans-serif" font-size="12" font-weight="normal" fill="#80571a">Experts 1–2</text><text x="842" y="448" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="12" font-weight="normal" fill="#80571a">Experts 3–4</text><text x="953" y="448" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="12" font-weight="normal" fill="#80571a">Experts 5–6</text><text x="1064" y="448" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="12" font-weight="normal" fill="#80571a">Experts 7–8</text><text x="899" y="502" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#80571a">Combine results → 原序列</text><text x="295" y="520" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#9c4d30">独立处理多个请求</text><text x="55" y="591" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#60716c">TP/PP/DP/EP 可以组合，但 GPU 数量、rank 布局、跨节点通信与队列不是一个“乘法加速公式”。</text></svg>