<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" viewBox="0 0 1200 660"><title id="svgtitle">RAG zero trust data pipeline</title><desc id="svgdesc">Authenticated gateway scopes document ACLs before retrieval. Retrieved passages are untrusted data used to construct bounded context. A vLLM model returns text; citation IDs are checked against retrieved source IDs before presenting evidence.</desc><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#557e75" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" rx="20" fill="#fbfaf7"/><text x="60" y="53" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#1b3834">RAG：检索到的文本是数据，不是授权指令</text><rect id="gateway-auth" x="60" y="129" width="222" height="114" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="171" y="172" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">身份 / 权限</text><text x="171" y="209" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">Gateway / ACL</text><rect id="retriever" x="358" y="129" width="222" height="114" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="469" y="172" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">文档检索</text><text x="469" y="209" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">Retriever + Scores</text><rect id="context-builder" x="656" y="129" width="222" height="114" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="767" y="172" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">上下文构造</text><text x="767" y="209" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">IDs / Token Budget</text><rect id="generator" x="954" y="129" width="222" height="114" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="1065" y="172" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">生成与引用</text><text x="1065" y="209" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">vLLM + Validation</text><path id="auth-to-retrieve" d="M282 185 L347 185" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="retrieve-to-context" d="M580 185 L645 185" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="context-to-generate" d="M878 185 L942 185" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect id="untrusted-boundary" x="95" y="305" width="405" height="174" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="1.8"/><text x="300" y="347" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#9c4d30">不可信数据边界</text><text x="300" y="388" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#87533f">Doc A、Doc B 的内容不具备工具权限</text><text x="300" y="429" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#87533f">即使文档包含伪系统指令也只作为文本处理</text><rect id="output-boundary" x="705" y="305" width="405" height="174" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="908" y="348" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#0d5e58">输出验证边界</text><text x="908" y="390" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#0d5e58">引用 ID 必须来自被授权检索结果</text><text x="908" y="427" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#60716c">真实性仍需语义评估，不等同于引用存在</text><path id="retrieve-to-untrusted" d="M469 243 V301" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="generate-to-validation" d="M1065 243 V301" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="source-to-validation" d="M500 392 L692 392" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><text id="validation-basis" x="596" y="383" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="12" font-weight="400" fill="#53636b">授权来源 ID</text><rect x="55" y="532" width="1090" height="72" rx="12" fill="#fff" stroke="#b7cbc3" stroke-width="1.8"/><text x="600" y="560" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#264b45">检索 Recall@k 与答案 Faithfulness 分开测；Serving 延迟应拆解为检索、排队、Prefill、Decode。</text><text x="600" y="585" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#60716c">教学 demo 使用标准库文本匹配；可选 Loopback vLLM，不自动声称真实质量或吞吐。</text></svg>
