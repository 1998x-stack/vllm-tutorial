<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Nano vLLM control flow through code components</title><desc id="desc">Pinned nano-vLLM implementation flows from LLMEngine add_request to Scheduler schedule, then BlockManager allocation, ModelRunner prefill/decode and Sampler. Scheduler postprocess updates sequence completion and frees KV blocks.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#47756d"/></marker></defs><rect width="1200" height="620" rx="24" fill="#fbfaf7"/><text x="55" y="52" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#1f3835">nano-vLLM：跟踪一次请求的真实函数调用</text><rect id="llm-engine" x="55" y="104" width="225" height="110" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><text x="167" y="140" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#51488c">LLMEngine</text><text x="167" y="168" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">generate / add_request</text><text x="167" y="191" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">step()</text><path id="engine-to-scheduler" d="M280 159 L350 159" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="scheduler" x="365" y="104" width="240" height="110" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="485" y="139" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#0d5e58">Scheduler</text><text x="485" y="168" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">waiting / running</text><text x="485" y="191" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">schedule()</text><path id="scheduler-to-blockmanager" d="M605 159 L680 159" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path id="scheduler-to-runner" d="M485 214 V255 H760 V282" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="492" y="248" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="13" fill="#0d5e58">schedule() 返回本轮 batch</text><rect id="block-manager" x="695" y="104" width="225" height="110" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/><text x="807" y="139" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#80571a">BlockManager</text><text x="807" y="169" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">allocate / reuse</text><text x="807" y="190" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">KV blocks</text><path id="blockmanager-to-runner" d="M806 214 L806 273" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><text x="814" y="250" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="12" fill="#80571a">block_table</text><rect id="model-runner" x="625" y="286" width="370" height="125" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="810" y="318" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#9c4d30">ModelRunner</text><text x="810" y="350" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">prepare_prefill / prepare_decode</text><text x="810" y="382" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">run_model → sample token</text><path id="runner-to-attention" d="M625 348 L547 348" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="attention-triton" x="267" y="286" width="280" height="125" rx="12" fill="#fff" stroke="#b7cbc3" stroke-width="2"/><text x="406" y="323" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#264b45">Attention / Triton</text><text x="406" y="353" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">slot_mapping</text><text x="406" y="381" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">write KV cache</text><path id="runner-to-postprocess" d="M626 407 L626 475" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="postprocess" x="402" y="490" width="448" height="89" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="627" y="528" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#0d5e58">Scheduler.postprocess</text><text x="627" y="558" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">append token · finish · deallocate</text><path id="postprocess-to-result" d="M402 534 L277 534" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect id="result-sequence" x="54" y="482" width="210" height="98" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><text x="159" y="518" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#51488c">Result / Sequence</text><text x="159" y="549" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">返回生成结果</text><text x="1010" y="519" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#60716c">学习对象</text><text x="1010" y="546" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#60716c">非生产组件映射</text></svg>