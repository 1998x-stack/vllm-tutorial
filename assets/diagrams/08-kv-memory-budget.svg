<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">GPU 显存预算与 KV Cache 容量关系</title>
<desc id="desc">GPU 显存先由模型权重、运行时工作区和其他进程占用，剩余部分才可能用于 KV Cache。KV Cache 单 token 大小由层数、KV heads、head dimension、K/V 两份张量和 dtype 字节数决定；并发请求的缓存长度相加。</desc>
<rect width="1200" height="560" rx="24" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f3835">KV Cache 能用多少显存，取决于总预算和请求形状</text>
<text x="52" y="85" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#60716c">示意图不按比例绘制；不能把 GPU 总显存全部当作 KV Cache 容量。</text>
<rect x="60" y="140" width="1080" height="105" rx="15" fill="#fff" stroke="#dce4e1" stroke-width="2"/>
<rect x="60" y="140" width="350" height="105" rx="15" fill="#e5f3ef" stroke="#147d73"/>
<rect x="410" y="140" width="270" height="105" fill="#f0effa" stroke="#6d63a8"/>
<rect x="680" y="140" width="300" height="105" fill="#fff0e8" stroke="#c66a46"/>
<rect x="980" y="140" width="160" height="105" rx="15" fill="#f1f3f2" stroke="#c8d1cd"/>
<g font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle">
 <text x="235" y="183" font-size="19" font-weight="700" fill="#0d5e58">模型权重</text><text x="235" y="212" font-size="15" fill="#315d56">Weights</text>
 <text x="545" y="183" font-size="18" font-weight="700" fill="#51488c">运行时工作区</text><text x="545" y="212" font-size="15" fill="#625b91">Activations / Graphs</text>
 <text x="830" y="183" font-size="18" font-weight="700" fill="#9c4d30">KV Cache</text><text x="830" y="212" font-size="15" fill="#87533f">随请求长度变化</text>
 <text x="1060" y="183" font-size="16" font-weight="700" fill="#53636b">其他</text><text x="1060" y="212" font-size="14" fill="#60716c">进程 / 缓冲</text>
</g>
<text x="60" y="300" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#264b45">单 token KV Cache 的理论字节数</text>
<rect x="60" y="320" width="1080" height="74" rx="13" fill="#fff" stroke="#dce4e1"/>
<text x="600" y="366" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#264b45">2 × 层数 × KV heads × head_dim × dtype bytes</text>
<text x="60" y="439" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#264b45">并发请求的缓存需求</text>
<rect x="60" y="458" width="1080" height="58" rx="12" fill="#e5f3ef" stroke="#147d73"/>
<text x="600" y="494" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#0d5e58">总 KV Cache ≈ 每 token 字节数 × 所有活跃请求的缓存 token 数之和</text>
</svg>