<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">EngineCore 的一次 step 与 busy loop</title>
<desc id="desc">EngineCore busy loop 处理输入队列后调用 step。step 检查是否有请求，Scheduler 生成 SchedulerOutput，ModelExecutor 执行模型，EngineCore 收集输出并调用 Scheduler.update_from_output，最后把 EngineCoreOutputs 放入输出队列并进入下一轮。</desc>
<defs><marker id="a12s" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#47756d"/></marker></defs>
<rect width="1200" height="500" rx="24" fill="#fbfaf7"/>
<text x="52" y="52" font-family="Arial,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#1f3835">EngineCore：接收输入 → 调度 → 执行 → 更新 → 返回输出</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect x="55" y="130" width="220" height="92" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="165" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#0d5e58">处理输入队列</text>
 <text x="165" y="195" text-anchor="middle" font-size="14" fill="#315d56">ADD / ABORT / Utility</text>
 <path d="M275 176 H315" stroke="#47756d" stroke-width="2.5" marker-end="url(#a12s)"/>
 <rect x="330" y="130" width="190" height="92" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="425" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#51488c">Scheduler.schedule</text>
 <text x="425" y="195" text-anchor="middle" font-size="14" fill="#625b91">SchedulerOutput</text>
 <path d="M520 176 H560" stroke="#47756d" stroke-width="2.5" marker-end="url(#a12s)"/>
 <rect x="575" y="130" width="190" height="92" rx="14" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <text x="670" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#9c4d30">Executor 执行</text>
 <text x="670" y="195" text-anchor="middle" font-size="14" fill="#87533f">Worker / Model Runner</text>
 <path d="M765 176 H805" stroke="#47756d" stroke-width="2.5" marker-end="url(#a12s)"/>
 <rect x="820" y="130" width="190" height="92" rx="14" fill="#fff" stroke="#b7cbc3" stroke-width="2"/>
 <text x="915" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#264b45">收集模型输出</text>
 <text x="915" y="195" text-anchor="middle" font-size="14" fill="#53636b">ModelRunnerOutput</text>
 <path d="M1010 176 H1050" stroke="#47756d" stroke-width="2.5" marker-end="url(#a12s)"/>
 <rect x="1065" y="130" width="100" height="92" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="1115" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#0d5e58">Update</text>
 <text x="1115" y="195" text-anchor="middle" font-size="12" fill="#315d56">状态</text>
 <path d="M1115 222 V300 H920" fill="none" stroke="#47756d" stroke-width="2.5" marker-end="url(#a12s)"/>
 <rect x="700" y="300" width="220" height="78" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="810" y="331" text-anchor="middle" font-size="18" font-weight="700" fill="#51488c">输出队列</text>
 <text x="810" y="356" text-anchor="middle" font-size="14" fill="#625b91">EngineCoreOutputs</text>
 <path d="M700 339 H165 V222" fill="none" stroke="#47756d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a12s)"/>
</g>
<rect x="55" y="415" width="1110" height="46" rx="11" fill="#fff6df" stroke="#d5a24a"/>
<text x="80" y="444" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#80571a">Busy loop：</text>
<text x="175" y="444" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#80571a">没有工作时等待输入；有未完成请求时执行 step；每轮之后继续处理下一批输入与输出。</text>
</svg>