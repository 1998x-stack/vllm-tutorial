<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">V1 Scheduler 的抢占与重算路径</title>
<desc id="desc">请求申请 KV Cache blocks 失败时，Scheduler 根据 FCFS 或 Priority 选择 Running 请求，将其状态设为 PREEMPTED，释放 KV blocks，重置计算进度并放回 Waiting 队列。之后重新接纳时可能命中 Prefix Cache，也可能重新 Prefill。</desc>
<defs><marker id="a10p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#47756d"/></marker></defs>
<rect width="1200" height="500" rx="24" fill="#fbfaf7"/>
<text x="52" y="52" font-family="Arial,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#1f3835">KV Cache 不足：抢占释放空间，恢复时可能需要重算</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect id="step-fail" x="55" y="128" width="210" height="100" rx="14" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/>
 <text x="160" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#80571a">KV 分配失败</text>
 <text x="160" y="195" text-anchor="middle" font-size="14" fill="#80571a">当前请求需要新 blocks</text>
 <path d="M265 178 H305" stroke="#47756d" stroke-width="2.5" marker-end="url(#a10p)"/>
 <rect id="step-victim" x="320" y="128" width="220" height="100" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="430" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#51488c">选择抢占对象</text>
 <text x="430" y="195" text-anchor="middle" font-size="14" fill="#625b91">另一条 Running 请求 · FCFS / Priority</text>
 <path d="M540 178 H580" stroke="#47756d" stroke-width="2.5" marker-end="url(#a10p)"/>
 <rect id="step-preempted" x="595" y="128" width="240" height="100" rx="14" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <text x="715" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#9c4d30">PREEMPTED</text>
 <text x="715" y="195" text-anchor="middle" font-size="14" fill="#87533f">free blocks · progress = 0</text>
 <path d="M835 178 H875" stroke="#47756d" stroke-width="2.5" marker-end="url(#a10p)"/>
 <rect id="step-waiting" x="890" y="128" width="250" height="100" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="1015" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#0d5e58">回到 Waiting</text>
 <text x="1015" y="195" text-anchor="middle" font-size="14" fill="#315d56">等待下一轮重新接纳</text>
 <path id="waiting-to-readmit" d="M1015 228 V300 H720" fill="none" stroke="#47756d" stroke-width="2.5" marker-end="url(#a10p)"/>
 <rect id="step-readmit" x="440" y="300" width="280" height="94" rx="14" fill="#fff" stroke="#b7cbc3" stroke-width="2"/>
 <text x="580" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#264b45">重新接纳</text>
 <text x="580" y="366" text-anchor="middle" font-size="14" fill="#53636b">查找可复用的前缀状态</text>
 <path id="readmit-to-hit" d="M440 347 H310" stroke="#47756d" stroke-width="2.5" marker-end="url(#a10p)"/>
 <rect id="step-hit" x="55" y="300" width="255" height="94" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="182" y="337" text-anchor="middle" font-size="18" font-weight="700" fill="#0d5e58">Prefix Cache 命中</text>
 <text x="182" y="366" text-anchor="middle" font-size="14" fill="#315d56">复用仍驻留的 KV blocks</text>
 <path id="readmit-to-recompute" d="M580 394 V435 H850" stroke="#47756d" stroke-width="2.5" marker-end="url(#a10p)"/>
 <rect id="step-recompute" x="850" y="398" width="290" height="72" rx="14" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <text x="995" y="428" text-anchor="middle" font-size="17" font-weight="700" fill="#9c4d30">未命中：重新 Prefill</text>
 <text x="995" y="452" text-anchor="middle" font-size="13" fill="#87533f">重新计算需要的前缀 token</text>
</g>
</svg>