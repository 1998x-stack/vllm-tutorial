<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" viewBox="0 0 1200 660"><title id="svgtitle">Inference roadmap evidence maturity ladder</title><desc id="svgdesc">Five evidence steps lead from research and RFC, implementation in a pinned commit, documented released support, reproducible benchmark, to production monitoring. The ladder is not a claim that particular features are mature.</desc><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#557e75" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" rx="20" fill="#fbfaf7"/><text x="60" y="54" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#1b3834">技术雷达：每一级都是不同强度的证据</text><rect id="step-1" x="70" y="434" width="198" height="128" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="94" y="464" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#53636b">01</text><text x="169" y="504" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">论文 / RFC</text><text x="169" y="536" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">提出假设</text><rect id="step-2" x="297" y="356" width="198" height="128" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="321" y="386" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#53636b">02</text><text x="396" y="426" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">固定源码</text><text x="396" y="458" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">确认已实现</text><rect id="step-3" x="524" y="278" width="198" height="128" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="548" y="308" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#53636b">03</text><text x="623" y="348" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">官方 Release</text><text x="623" y="380" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">支持与限制</text><rect id="step-4" x="751" y="200" width="198" height="128" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="775" y="230" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#53636b">04</text><text x="850" y="270" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">复现实验</text><text x="850" y="302" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">模型 / GPU / 负载</text><rect id="step-5" x="978" y="122" width="198" height="128" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><path id="step-1-to-2" d="M268 498 L294 424" fill="none" stroke="#557e75" stroke-width="2.2" marker-end="url(#arr)"/><path id="step-2-to-3" d="M495 420 L521 346" fill="none" stroke="#557e75" stroke-width="2.2" marker-end="url(#arr)"/><path id="step-3-to-4" d="M722 342 L748 268" fill="none" stroke="#557e75" stroke-width="2.2" marker-end="url(#arr)"/><path id="step-4-to-5" d="M949 264 L975 190" fill="none" stroke="#557e75" stroke-width="2.2" marker-end="url(#arr)"/><text id="ladder-note" x="60" y="590" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#80571a">箭头表示证据强度递增，不代表功能必须按顺序成熟，也不是路线图承诺。</text><text x="1002" y="152" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#53636b">05</text><text x="1077" y="192" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#244743">生产观测</text><text x="1077" y="224" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">质量 / SLO / 回滚</text><text x="59" y="617" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#60716c">性能推断必须带版本、模型、硬件、数据集、延迟分位数与复测结果。</text></svg>
