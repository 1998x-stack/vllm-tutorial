<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Paged KV Cache 的逻辑块到物理块映射</title>
<desc id="desc">一个 token 序列按每块四个 token 切成逻辑块。Block Table 保存逻辑块到物理块 ID 的映射，例如逻辑块 2 映射到物理块 11。物理块可分散在显存块池中，不要求彼此相邻。</desc>
<defs><marker id="a03" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#47756d"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f3835">逻辑连续，物理不必连续</text>
<text x="52" y="85" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#60716c">教学例子：每个 KV block 容纳 4 个 token。真实 block size 由配置和后端约束决定。</text>
<text x="62" y="145" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#264b45">逻辑 token 序列</text>
<g font-family="Arial,'PingFang SC',sans-serif" font-size="17" text-anchor="middle">
 <rect x="60" y="168" width="250" height="58" rx="10" fill="#e5f3ef" stroke="#147d73"/><text x="185" y="203" fill="#0d5e58">t₀  t₁  t₂  t₃</text>
 <rect x="325" y="168" width="250" height="58" rx="10" fill="#e5f3ef" stroke="#147d73"/><text x="450" y="203" fill="#0d5e58">t₄  t₅  t₆  t₇</text>
 <rect x="590" y="168" width="250" height="58" rx="10" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="715" y="203" fill="#9c4d30">t₈  t₉  t₁₀  t₁₁</text>
 <rect x="855" y="168" width="250" height="58" rx="10" fill="#e5f3ef" stroke="#147d73"/><text x="980" y="203" fill="#0d5e58">t₁₂  t₁₃  t₁₄  t₁₅</text>
</g>
<g font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#53636b" text-anchor="middle">
 <text x="185" y="249">逻辑块 0</text><text x="450" y="249">逻辑块 1</text><text x="715" y="249">逻辑块 2</text><text x="980" y="249">逻辑块 3</text>
</g>
<path d="M185 263 V300 H150 V330" fill="none" stroke="#47756d" stroke-width="2.5" marker-end="url(#a03)"/>
<path d="M450 263 V300 H420 V330" fill="none" stroke="#47756d" stroke-width="2.5" marker-end="url(#a03)"/>
<path d="M715 263 V300 H690 V330" fill="none" stroke="#c66a46" stroke-width="3" marker-end="url(#a03)"/>
<path d="M980 263 V300 H960 V330" fill="none" stroke="#47756d" stroke-width="2.5" marker-end="url(#a03)"/>
<rect x="60" y="330" width="1035" height="90" rx="15" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
<text x="88" y="363" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#51488c">Block Table</text>
<g font-family="Arial,'PingFang SC',sans-serif" font-size="19" text-anchor="middle">
 <rect x="300" y="348" width="120" height="50" rx="9" fill="#fff" stroke="#aaa4d0"/><text x="360" y="380" fill="#51488c">7</text>
 <rect x="445" y="348" width="120" height="50" rx="9" fill="#fff" stroke="#aaa4d0"/><text x="505" y="380" fill="#51488c">2</text>
 <rect x="590" y="348" width="120" height="50" rx="9" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="650" y="380" fill="#9c4d30">11</text>
 <rect x="735" y="348" width="120" height="50" rx="9" fill="#fff" stroke="#aaa4d0"/><text x="795" y="380" fill="#51488c">4</text>
</g>
<text x="60" y="461" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#264b45">物理 block pool（示意）</text>
<g font-family="Arial,'PingFang SC',sans-serif" font-size="15" text-anchor="middle">
 <rect x="60" y="480" width="130" height="48" rx="9" fill="#e5f3ef" stroke="#147d73"/><text x="125" y="510" fill="#0d5e58">Block 2</text>
 <rect x="205" y="480" width="130" height="48" rx="9" fill="#f2f3f2" stroke="#c8d1cd"/><text x="270" y="510" fill="#77837e">Block 3</text>
 <rect x="350" y="480" width="130" height="48" rx="9" fill="#e5f3ef" stroke="#147d73"/><text x="415" y="510" fill="#0d5e58">Block 4</text>
 <rect x="495" y="480" width="130" height="48" rx="9" fill="#f2f3f2" stroke="#c8d1cd"/><text x="560" y="510" fill="#77837e">Block 5</text>
 <rect x="640" y="480" width="130" height="48" rx="9" fill="#f2f3f2" stroke="#c8d1cd"/><text x="705" y="510" fill="#77837e">Block 6</text>
 <rect x="785" y="480" width="130" height="48" rx="9" fill="#e5f3ef" stroke="#147d73"/><text x="850" y="510" fill="#0d5e58">Block 7</text>
 <rect x="930" y="480" width="130" height="48" rx="9" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="995" y="510" fill="#9c4d30">Block 11</text>
</g>
</svg>