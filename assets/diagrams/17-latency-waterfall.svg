<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">LLM request latency timeline and metric definitions</title>
<desc id="desc">Timeline starts with request sent, then queue waiting, prefill, first streamed token, decode steps and final token. TTFT spans request send to first output. Queue time is the waiting segment. ITL is the gap between adjacent streamed outputs. TPOT averages generation duration over output tokens excluding the first. End-to-end spans request send to final output.</desc>
<rect width="1200" height="620" rx="24" fill="#fbfaf7"/>
<text x="52" y="52" font-family="Arial,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#1f3835">一次请求的时间线：先明确每个指标测量哪一段</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <line x1="105" y1="210" x2="1090" y2="210" stroke="#9aaba5" stroke-width="3"/>
 <g id="timeline-events" fill="#264b45">
  <circle cx="105" cy="210" r="8"/><circle cx="325" cy="210" r="8"/><circle cx="565" cy="210" r="8"/><circle cx="700" cy="210" r="8"/><circle cx="845" cy="210" r="8"/><circle cx="980" cy="210" r="8"/><circle cx="1090" cy="210" r="8"/>
 </g>
 <rect id="seg-queue" x="105" y="165" width="220" height="25" rx="6" fill="#fff6df" stroke="#d5a24a"/>
 <text x="215" y="183" text-anchor="middle" font-size="13" fill="#80571a">Queue</text>
 <rect id="seg-prefill" x="325" y="165" width="240" height="25" rx="6" fill="#e5f3ef" stroke="#147d73"/>
 <text x="445" y="183" text-anchor="middle" font-size="13" fill="#0d5e58">Prefill</text>
 <rect id="seg-decode" x="565" y="165" width="525" height="25" rx="6" fill="#f0effa" stroke="#6d63a8"/>
 <text x="827" y="183" text-anchor="middle" font-size="13" fill="#51488c">Decode</text>
 <text x="105" y="245" text-anchor="middle" font-size="13" fill="#53636b">Request sent</text>
 <text x="325" y="245" text-anchor="middle" font-size="13" fill="#53636b">Scheduled</text>
 <text x="565" y="245" text-anchor="middle" font-size="13" fill="#53636b">First token</text>
 <text x="700" y="245" text-anchor="middle" font-size="13" fill="#53636b">Output 2</text>
 <text x="845" y="245" text-anchor="middle" font-size="13" fill="#53636b">Output 3</text>
 <text x="980" y="245" text-anchor="middle" font-size="13" fill="#53636b">Output 4</text>
 <text x="1090" y="245" text-anchor="middle" font-size="13" fill="#53636b">Final output</text>
 <path id="span-ttft" d="M105 125 V105 H565 V125" fill="none" stroke="#c66a46" stroke-width="3"/>
 <text x="335" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#9c4d30">TTFT = first output − request sent</text>
 <path id="span-e2e" d="M105 285 V310 H1090 V285" fill="none" stroke="#6d63a8" stroke-width="3"/>
 <text x="598" y="338" text-anchor="middle" font-size="17" font-weight="700" fill="#51488c">End-to-End = final output − request sent</text>
 <path id="span-itl" d="M700 380 V400 H845 V380" fill="none" stroke="#147d73" stroke-width="3"/>
 <text x="772" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#0d5e58">ITL = 相邻输出事件间隔</text>
 <rect id="tpot-note" x="55" y="465" width="1090" height="65" rx="12" fill="#fff6df" stroke="#d5a24a"/>
 <text x="78" y="493" font-size="14" font-weight="700" fill="#80571a">TPOT（请求级）</text>
 <text x="78" y="516" font-size="14" fill="#80571a">≈ (E2E − TTFT) / (输出 token 数 − 1)。当一个流式事件包含多个 token 时，ITL 与 TPOT 不再等价。</text>
</g>
<text id="boundary-note" x="55" y="575" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#60716c">测量边界：“Request sent / Final output” 为客户端观测点；服务端 Queue Time 从引擎收到请求起计，因此与图中的 Queue 段不完全等价。</text>
</svg>