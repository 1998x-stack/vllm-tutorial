<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="life-title life-desc">
<title id="life-title">Prefill 产生首个输出 token，Decode 逐轮复用 KV Cache</title>
<desc id="life-desc">标准单请求自回归生成示意：Prompt 进入 Prefill，同时写入历史 K/V；最后一个 Prompt 位置的 logits 经采样产生 y1。y1 作为第一轮 Decode 的输入，新 token 的查询读取缓存 K/V，并追加该位置的 K/V。Decode 的 logits 采样出下一 token，若未停止，下一 token 回到 Decode 输入，不返回 Prefill。</desc>
<defs>
  <marker id="life-forward" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#147d73"/></marker>
  <marker id="life-loop" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c66a46"/></marker>
  <marker id="life-cache" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6d63a8"/></marker>
</defs>
<rect width="1200" height="790" rx="24" fill="#fbfaf7"/>
<text x="48" y="53" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#1f3835">谁产生第一个 token？下一个 token 又从哪里来？</text>
<text x="48" y="85" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#60716c">标准单请求、带 KV Cache 的自回归路径（省略多请求调度及分块预填充细节）</text>

<rect x="45" y="119" width="1110" height="219" rx="18" fill="#eef6f3" stroke="#d0e5dd"/>
<text x="70" y="151" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#186d64">阶段 ①　Prefill：处理 prompt，然后采样首个输出</text>
<rect x="56" y="185" width="180" height="104" rx="13" fill="#ffffff" stroke="#90bfb3" stroke-width="2"/>
<text x="146" y="225" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="#264b45">Prompt</text>
<text x="146" y="253" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="16" fill="#53636b">x₁ ... xₙ</text>
<path id="prompt-to-prefill" d="M236 237 H274" fill="none" stroke="#147d73" stroke-width="3" marker-end="url(#life-forward)"/>
<rect x="285" y="174" width="290" height="125" rx="15" fill="#dbf0e8" stroke="#147d73" stroke-width="2"/>
<text x="430" y="212" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="23" font-weight="700" fill="#0d5e58">Prefill 前向</text>
<text x="430" y="241" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="16" fill="#315d56">处理 prompt 位置、构建 K/V</text>
<text x="430" y="269" font-family="Arial,'PingFang SC',sans-serif" text-anchor="middle" font-size="16" fill="#315d56">最后位置产生 next-token logits</text>
<path id="prefill-to-first-token" d="M575 237 H812" fill="none" stroke="#147d73" stroke-width="3" marker-end="url(#life-forward)"/>
<text x="696" y="220" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#315d56">不是从 KV Cache 直接采样</text>
<rect x="825" y="181" width="320" height="114" rx="15" fill="#ffffff" stroke="#147d73" stroke-width="2"/>
<text x="985" y="218" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#0d5e58">logits → 采样 y₁</text>
<text x="985" y="247" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53636b">第一个生成 token</text>
<text x="985" y="272" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#53636b">来自 prompt 最后位置的预测</text>

<rect x="330" y="350" width="270" height="100" rx="15" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
<text x="465" y="387" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#51488c">KV Cache</text>
<text x="465" y="412" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#625b91">保存各层已处理位置的 K/V</text>
<text x="465" y="435" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#625b91">不保存完整历史 Q</text>
<path id="prefill-to-kv" d="M430 299 V340" fill="none" stroke="#6d63a8" stroke-width="3" marker-end="url(#life-cache)"/>
<text x="445" y="335" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#625b91">写入 prompt K/V</text>

<rect x="45" y="506" width="1110" height="154" rx="18" fill="#fff4ed" stroke="#edd5c6"/>
<text x="70" y="530" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#9c4d30">阶段 ②　Decode：输入上一步采样的 token，按需循环</text>
<rect x="76" y="547" width="195" height="90" rx="13" fill="#ffffff" stroke="#c66a46" stroke-width="2"/>
<text x="173" y="582" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#9c4d30">当前输入 yₜ</text>
<text x="173" y="607" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#87533f">首次为 y₁</text>
<path id="first-token-to-decode-input" d="M985 295 H1144 V492 H56 V592 H76" fill="none" stroke="#147d73" stroke-width="2.5" marker-end="url(#life-forward)"/>
<text x="801" y="481" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#315d56">首个输出进入后续单 token 计算</text>
<path id="decode-input-to-step" d="M271 593 H333" fill="none" stroke="#c66a46" stroke-width="3" marker-end="url(#life-loop)"/>
<rect x="345" y="547" width="345" height="90" rx="13" fill="#ffffff" stroke="#c66a46" stroke-width="2"/>
<text x="517" y="582" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#9c4d30">Decode 单步前向</text>
<text x="517" y="609" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#87533f">新 Q 读取已有 K/V；计算本轮 K/V</text>
<path id="kv-to-decode" d="M390 450 V536" fill="none" stroke="#6d63a8" stroke-width="2.6" marker-end="url(#life-cache)"/>
<text x="315" y="478" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#625b91">读取已有 K/V</text>
<path id="decode-to-kv" d="M563 547 V460" fill="none" stroke="#6d63a8" stroke-width="2.6" marker-end="url(#life-cache)"/>
<text x="573" y="478" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#625b91">追加当前 K/V</text>
<path id="decode-step-to-sample" d="M690 593 H808" fill="none" stroke="#c66a46" stroke-width="3" marker-end="url(#life-loop)"/>
<rect x="820" y="547" width="315" height="90" rx="13" fill="#ffffff" stroke="#c66a46" stroke-width="2"/>
<text x="978" y="582" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#9c4d30">logits → 采样 yₜ₊₁</text>
<text x="978" y="608" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#87533f">检查 EOS / stop / token 上限</text>

<path id="decode-repeat-edge" d="M977 637 V698 H173 V647" fill="none" stroke="#c66a46" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#life-loop)"/>
<text x="620" y="688" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#9c4d30">未停止：下一个 yₜ₊₁ 返回 Decode 输入，绝不返回 Prefill</text>
<text x="52" y="750" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#53636b">每轮仍需读取越来越长的历史 K/V；缓存省掉的是历史位置的重复投影与前向计算。</text>
<text x="52" y="772" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#697772">注意：chunked prefill、推测解码和 P/D 分离会改变具体执行步数；此图只展示基础语义。</text>
</svg>