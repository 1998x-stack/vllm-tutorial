<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">第一次运行 vLLM 的路径：先备好环境，再分别验证两条接口</title>
<desc id="desc">步骤 1 检查操作系统、Python、GPU 驱动与模型访问，步骤 2 在隔离环境中安装 vLLM。安装完成后，离线批量推理（Python API）与在线服务（OpenAI 兼容 API）是两条独立的验证路径，可分别进行。官方 Docker 镜像可替代步骤 1–2 的手动安装。</desc>
<defs><marker id="a06" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#147d73"/></marker></defs>
<rect width="1200" height="540" rx="24" fill="#fbfaf7"/>
<text x="52" y="54" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#1f3835">先备好环境，再分别验证两条接口</text>
<text x="52" y="85" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#60716c">不要先复制一条安装命令；先确认硬件平台、Python 与驱动版本是否匹配。</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect id="step-check" x="150" y="140" width="330" height="100" rx="16" fill="#fff" stroke="#b7cbc3" stroke-width="2"/>
 <circle cx="190" cy="176" r="20" fill="#e5f3ef"/><text x="190" y="183" text-anchor="middle" font-size="19" font-weight="700" fill="#0d5e58">1</text>
 <text x="220" y="183" font-size="20" font-weight="700" fill="#264b45">检查环境</text>
 <text x="176" y="208" font-size="14" fill="#53636b">OS / Python / GPU / Driver</text>
 <text x="176" y="229" font-size="14" fill="#53636b">磁盘空间与模型访问权限</text>
 <path d="M480 190 H532" stroke="#147d73" stroke-width="3" marker-end="url(#a06)"/>
 <rect id="step-install" x="540" y="140" width="330" height="100" rx="16" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <circle cx="580" cy="176" r="20" fill="#fff"/><text x="580" y="183" text-anchor="middle" font-size="19" font-weight="700" fill="#0d5e58">2</text>
 <text x="610" y="183" font-size="20" font-weight="700" fill="#0d5e58">安装 vLLM</text>
 <text x="566" y="208" font-size="14" fill="#315d56">隔离环境 · 平台对应 wheel</text>
 <text x="566" y="229" font-size="14" fill="#315d56">vllm download-kernels</text>
 <rect id="docker-alt" x="920" y="140" width="230" height="100" rx="16" fill="#f2f6f4" stroke="#7f9a93" stroke-dasharray="6 5"/>
 <text x="1035" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#264b45">官方 Docker 镜像</text>
 <text x="1035" y="200" text-anchor="middle" font-size="13" fill="#5b6b66">可替代步骤 1–2</text>
 <text x="1035" y="220" text-anchor="middle" font-size="13" fill="#5b6b66">的手动安装</text>
</g>
<path d="M705 240 V283" stroke="#147d73" stroke-width="3"/>
<path d="M350 283 H850" stroke="#147d73" stroke-width="3"/>
<path d="M350 283 V326" stroke="#147d73" stroke-width="3" marker-end="url(#a06)"/>
<path d="M850 283 V326" stroke="#147d73" stroke-width="3" marker-end="url(#a06)"/>
<text x="600" y="274" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#0d5e58">安装成功后，两条验证路径可分别进行</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect id="step-offline" x="160" y="330" width="360" height="110" rx="16" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <circle cx="200" cy="366" r="20" fill="#fff"/><text x="200" y="373" text-anchor="middle" font-size="19" font-weight="700" fill="#51488c">3</text>
 <text x="230" y="373" font-size="20" font-weight="700" fill="#51488c">离线批量推理</text>
 <text x="186" y="404" font-size="14" fill="#625b91">LLM.generate() + SamplingParams</text>
 <text x="186" y="425" font-size="14" fill="#625b91">适合脚本与数据集任务</text>
 <rect id="step-server" x="680" y="330" width="360" height="110" rx="16" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <circle cx="720" cy="366" r="20" fill="#fff"/><text x="720" y="373" text-anchor="middle" font-size="19" font-weight="700" fill="#9c4d30">4</text>
 <text x="750" y="373" font-size="20" font-weight="700" fill="#9c4d30">在线服务验证</text>
 <text x="706" y="404" font-size="14" fill="#87533f">vllm serve · /v1/models</text>
 <text x="706" y="425" font-size="14" fill="#87533f">Chat Completions / OpenAI SDK</text>
</g>
<rect x="90" y="462" width="1020" height="58" rx="13" fill="#fff" stroke="#dce4e1"/>
<text x="116" y="487" font-family="Arial,'PingFang SC',sans-serif" font-size="15" fill="#53636b">排错先分层：驱动 / 安装、模型下载与加载、离线 vs 在线接口，分开定位再改一个变量。</text>
<text x="116" y="509" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#8a8172">安装矩阵、Python 范围、CUDA / ROCm 轮子与模型支持会随版本与硬件变化，运行前请对照官方矩阵。</text>
</svg>
