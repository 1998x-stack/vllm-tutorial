ext-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">Batching / EngineCore</text><rect id="grp-generation" x="900" y="103" width="244" height="123" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="1022" y="153" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#264b45">生成 14 / 21</text><text x="1022" y="191" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#53636b">Sampling / Speculative</text><path id="foundations-to-memory" d="M300 164 L328 164" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="memory-to-scheduling" d="M581 164 L610 164" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="scheduling-to-generation" d="M862 164 L891 164" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="top-bus" d="M178 240 H1022" fill="none" stroke="#557e75" stroke-width="1.8"/><path d="M178 226 V240" fill="none" stroke="#557e75" stroke-width="1.8"/><path d="M459 226 V240" fill="none" stroke="#557e75" stroke-width="1.8"/><path d="M741 226 V240" fill="none" stroke="#557e75" stroke-width="1.8"/><path d="M1022 226 V240" fill="none" stroke="#557e75" stroke-width="1.8"/><path id="row-to-execution" d="M617 240 L617 297" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect id="grp-execution" x="246" y="302" width="743" height="80" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="618" y="335" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#80571a">模型执行与多 GPU 19–20 / 22–23</text><text x="618" y="361" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#80571a">TP · PP · DP · EP · Multimodal · nano-vLLM</text><path id="execution-to-production" d="M617 383 L28