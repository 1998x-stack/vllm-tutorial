<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgtitle svgdesc" viewBox="0 0 1200 660"><title id="svgtitle">Troubleshooting evidence first</title><desc id="svgdesc">Triage tree separates model loading, GPU memory, distributed NCCL and latency symptoms, then collects evidence and tests one hypothesis before regression.</desc><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#557e75" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" rx="20" fill="#fbfaf7"/><text x="50" y="57" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#1b3834">排障是因果推理，而不是盲目调参</text><rect id="root-symptom" x="420" y="88" width="365" height="72" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="602" y="131" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#0d5e58">请求失败 / 延迟升高</text><path id="symptom-to-locate" d="M602 160 L602 205" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect id="locate-layer" x="470" y="218" width="270" height="64" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="1.8"/><text x="605" y="257" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#51488c">定位失败的层次</text><rect id="layer-model-load" x="68" y="342" width="246" height="104" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="191" y="380" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">下载 / 模型加载</text><text x="191" y="418" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#60716c">镜像 · 权重 · Tokenizer</text><rect id="layer-oom" x="360" y="342" width="246" height="104" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="483" y="380" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">GPU / KV OOM</text><text x="483" y="418" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#60716c">权重 · Prefill · Decode</text><rect id="layer-nccl" x="652" y="342" width="246" height="104" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="775" y="380" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">NCCL / 通信</text><text x="775" y="418" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#60716c">Rank · 网卡 · Timeout</text><rect id="layer-queue" x="944" y="342" width="246" height="104" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="1067" y="380" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#244743">排队 / 响应</text><text x="1067" y="418" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#60716c">TTFT · ITL · E2E</text><path id="locate-to-load" d="M603 282 L191 341" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="locate-to-oom" d="M603 282 L483 341" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="locate-to-nccl" d="M603 282 L775 341" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><path id="locate-to-queue" d="M603 282 L1067 341" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><text x="600" y="483" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="400" fill="#53636b">每条路径都先收集 evidence：版本、日志、负载、硬件、状态</text><path id="branches-to-loop" d="M1067 446 V468 H270 V500" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect id="hypothesis" x="120" y="505" width="302" height="83" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="1.8"/><text x="270" y="543" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#9c4d30">提出一个可证伪假设</text><text x="270" y="571" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#244743">最小复现 / 单变量改变</text><path id="hypothesis-to-gather" d="M422 546 L465 546" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect id="gather-evidence" x="482" y="505" width="256" height="83" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="1.8"/><text x="610" y="543" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#80571a">收集新证据</text><text x="610" y="571" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#244743">排除 / 确认根因</text><path id="gather-to-fix" d="M738 546 L781 546" fill="none" stroke="#557e75" stroke-width="2.4" marker-end="url(#arr)"/><rect id="fix-regression" x="798" y="505" width="290" height="83" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="1.8"/><text x="943" y="543" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#0d5e58">修复与回归验收</text><text x="943" y="571" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#244743">指标 · 质量 · 回滚条件</text><text x="60" y="626" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="400" fill="#60716c">DEBUG 或 CUDA_LAUNCH_BLOCKING 仅用于受控测试；日志和配置变更不得泄漏敏感数据。</text></svg>
