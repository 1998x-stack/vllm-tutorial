<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Multimodal inputs and fusion pathway</title><desc id="desc">Image, video and audio follow different media decoding and encoder paths. Media embeddings or features are combined with text input according to each model architecture. Security and request budgets are applied before preprocessing.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#47756d"/></marker></defs><rect width="1200" height="620" rx="24" fill="#fbfaf7"/><text x="55" y="53" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="27" font-weight="700" fill="#1f3835">Multimodal：媒体不是“一个额外的 token”</text><rect x="55" y="101" width="215" height="100" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/><text x="162" y="137" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#80571a">Gateway</text><text x="162" y="168" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#80571a">size / URL / auth</text><path d="M270 149 L333 149" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="350" y="88" width="210" height="127" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="455" y="123" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#0d5e58">Text tokens</text><text x="455" y="151" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">Tokenizer</text><text x="455" y="182" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#264b45">embedding lookup</text><rect x="350" y="240" width="210" height="117" rx="12" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/><text x="455" y="273" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#51488c">Image / Video</text><text x="455" y="305" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">decode · patches</text><text x="455" y="331" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">vision encoder</text><rect x="350" y="385" width="210" height="117" rx="12" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/><text x="455" y="420" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#9c4d30">Audio</text><text x="455" y="448" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">resample / features</text><text x="455" y="473" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">audio encoder</text><rect x="670" y="212" width="211" height="163" rx="12" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/><text x="775" y="249" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#0d5e58">Model-specific</text><text x="775" y="279" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="16" font-weight="normal" fill="#264b45">projection / fusion</text><text x="775" y="313" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">modality positions</text><text x="775" y="341" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#264b45">attention structure</text><path d="M560 158 L669 258" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M560 296 L669 284" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M560 444 L669 341" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><path d="M881 285 L935 285" stroke="#47756d" stroke-width="2.5" fill="none"  marker-end="url(#arrow)"/><rect x="945" y="220" width="198" height="137" rx="12" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/><text x="1044" y="256" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#80571a">LLM / Decoder</text><text x="1044" y="288" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">prefill → decode</text><text x="1044" y="318" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="15" font-weight="normal" fill="#264b45">generated tokens</text><rect x="55" y="535" width="1088" height="55" rx="12" fill="#fff" stroke="#b7cbc3" stroke-width="2"/><text x="70" y="559" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="14" font-weight="normal" fill="#60716c">同一张图片可能展开成大量视觉特征；具体融合位置、跨注意力与 token 预算因模型而异。</text><text x="70" y="580" text-anchor="start" font-family="Arial,'PingFang SC',sans-serif" font-size="13" font-weight="normal" fill="#60716c">上线需单独验证媒体数量、分辨率、URL 访问、帧数、采样率和缓存的租户隔离。</text></svg>