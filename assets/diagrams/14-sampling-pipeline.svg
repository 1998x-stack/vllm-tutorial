<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Sampling and decoding conceptual pipeline</title>
<desc id="desc">Model logits are converted to a probability distribution. Logit processors and constraints alter scores or allowed tokens. Temperature changes distribution sharpness. Top-k, Top-p and Min-p filter candidate tokens. Remaining probabilities are renormalized and then greedy selection or random sampling chooses the next token.</desc>
<defs><marker id="a14" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#47756d"/></marker></defs>
<rect width="1200" height="570" rx="24" fill="#fbfaf7"/>
<text x="52" y="52" font-family="Arial,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#1f3835">Sampling：分数 → 概率 → 候选 → 下一个 Token</text>
<text x="52" y="82" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#60716c">概念流程；具体实现会因采样后端、设备和约束解码路径而变化。</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect x="55" y="160" width="175" height="105" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="142" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#51488c">Model logits</text>
 <text x="142" y="230" text-anchor="middle" font-size="14" fill="#625b91">z₁, z₂, …, zᵥ</text>
 <path d="M230 212 H280" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect x="295" y="160" width="190" height="105" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="390" y="199" text-anchor="middle" font-size="19" font-weight="700" fill="#0d5e58">Softmax</text>
 <text x="390" y="230" text-anchor="middle" font-size="14" fill="#315d56">概率分布 p(token)</text>
 <path d="M485 212 H535" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect x="550" y="135" width="210" height="155" rx="14" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/>
 <text x="655" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#80571a">Logits processors</text>
 <text x="655" y="207" text-anchor="middle" font-size="14" fill="#80571a">penalties · bias</text>
 <text x="655" y="232" text-anchor="middle" font-size="14" fill="#80571a">grammar / allowed IDs</text>
 <text x="655" y="261" text-anchor="middle" font-size="12" fill="#80571a">改变分数或允许集合</text>
 <path d="M760 212 H810" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect x="825" y="135" width="205" height="155" rx="14" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <text x="927" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#9c4d30">Temperature</text>
 <text x="927" y="211" text-anchor="middle" font-size="15" fill="#87533f">pᵢ(T) = softmax(zᵢ/T)</text>
 <text x="927" y="245" text-anchor="middle" font-size="13" fill="#87533f">改变分布尖锐程度</text>
 <path d="M927 290 V345 H760" fill="none" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect x="550" y="345" width="210" height="105" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="655" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#51488c">Candidate filters</text>
 <text x="655" y="412" text-anchor="middle" font-size="14" fill="#625b91">Top-k · Top-p · Min-p</text>
 <path d="M550 397 H500" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect x="295" y="345" width="190" height="105" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="390" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#0d5e58">Renormalize</text>
 <text x="390" y="412" text-anchor="middle" font-size="14" fill="#315d56">剩余概率重新归一化</text>
 <path d="M295 397 H245" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect x="55" y="345" width="175" height="105" rx="14" fill="#fff" stroke="#b7cbc3" stroke-width="2"/>
 <text x="142" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#264b45">Select token</text>
 <text x="142" y="412" text-anchor="middle" font-size="14" fill="#53636b">Greedy / Sample</text>
</g>
<rect x="55" y="490" width="1080" height="46" rx="11" fill="#fff6df" stroke="#d5a24a"/>
<text x="80" y="519" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#80571a">注意：Temperature=0 在 vLLM 中走 Greedy 特殊路径；本图不是所有 sampler kernel 的精确调用顺序。</text>
</svg>