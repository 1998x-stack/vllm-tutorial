<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Sampling 概念流程：logits → 处理与温度 → softmax → 候选过滤 → 取样</title>
<desc id="desc">模型 logits 先经过 logits processors（惩罚、bias、grammar 允许集合），再按 Temperature 缩放，然后由 softmax 转成概率分布。Top-k、Top-p、Min-p 在概率上裁剪候选，剩余概率重新归一化后用 greedy 或随机抽样选出下一个 token。</desc>
<defs><marker id="a14" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#47756d"/></marker></defs>
<rect width="1200" height="560" rx="24" fill="#fbfaf7"/>
<text x="52" y="52" font-family="Arial,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#1f3835">Sampling：分数 → 处理与温度 → 概率 → 候选 → 下一个 Token</text>
<text x="52" y="82" font-family="Arial,'PingFang SC',sans-serif" font-size="16" fill="#60716c">概念流程；Temperature 缩放 logits 后才做 softmax，具体实现会因采样后端与约束解码路径而变化。</text>
<g font-family="Arial,'PingFang SC',sans-serif">
 <rect id="model-logits" x="55" y="160" width="175" height="105" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="142" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#51488c">Model logits</text>
 <text x="142" y="230" text-anchor="middle" font-size="14" fill="#625b91">z₁, z₂, …, zᵥ</text>
 <path id="logits-to-processors" d="M230 212 H290" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect id="logits-processors" x="295" y="160" width="190" height="105" rx="14" fill="#fff6df" stroke="#d5a24a" stroke-width="2"/>
 <text x="390" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#80571a">Logits processors</text>
 <text x="390" y="222" text-anchor="middle" font-size="13" fill="#80571a">penalty · bias · allowed IDs</text>
 <text x="390" y="245" text-anchor="middle" font-size="12" fill="#80571a">作用在 logits 上</text>
 <path id="processors-to-temperature" d="M485 212 H545" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect id="temperature" x="550" y="160" width="205" height="105" rx="14" fill="#fff0e8" stroke="#c66a46" stroke-width="2"/>
 <text x="652" y="196" text-anchor="middle" font-size="18" font-weight="700" fill="#9c4d30">Temperature</text>
 <text x="652" y="222" text-anchor="middle" font-size="15" fill="#87533f">zᵢ / T（缩放 logits）</text>
 <text x="652" y="245" text-anchor="middle" font-size="12" fill="#87533f">改变分布尖锐程度</text>
 <path id="temperature-to-softmax" d="M755 212 H820" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect id="softmax" x="825" y="160" width="205" height="105" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="927" y="196" text-anchor="middle" font-size="19" font-weight="700" fill="#0d5e58">Softmax</text>
 <text x="927" y="222" text-anchor="middle" font-size="15" fill="#315d56">pᵢ = softmax(zᵢ/T)</text>
 <text x="927" y="245" text-anchor="middle" font-size="12" fill="#315d56">得到概率分布</text>
 <path id="softmax-to-filters" d="M927 265 V341" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect id="candidate-filters" x="825" y="345" width="205" height="105" rx="14" fill="#f0effa" stroke="#6d63a8" stroke-width="2"/>
 <text x="927" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#51488c">Candidate filters</text>
 <text x="927" y="412" text-anchor="middle" font-size="14" fill="#625b91">Top-k · Top-p · Min-p</text>
 <path id="filters-to-renormalize" d="M825 397 H765" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect id="renormalize" x="550" y="345" width="210" height="105" rx="14" fill="#e5f3ef" stroke="#147d73" stroke-width="2"/>
 <text x="655" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#0d5e58">Renormalize</text>
 <text x="655" y="412" text-anchor="middle" font-size="14" fill="#315d56">剩余概率重新归一化</text>
 <path id="renormalize-to-select" d="M550 397 H490" stroke="#47756d" stroke-width="2.5" marker-end="url(#a14)"/>
 <rect id="select-token" x="295" y="345" width="190" height="105" rx="14" fill="#fff" stroke="#b7cbc3" stroke-width="2"/>
 <text x="390" y="382" text-anchor="middle" font-size="18" font-weight="700" fill="#264b45">Select token</text>
 <text x="390" y="412" text-anchor="middle" font-size="14" fill="#53636b">Greedy / Sample</text>
</g>
<rect x="55" y="490" width="1080" height="46" rx="11" fill="#fff6df" stroke="#d5a24a"/>
<text x="80" y="519" font-family="Arial,'PingFang SC',sans-serif" font-size="14" fill="#80571a">注意：Temperature=0 在 vLLM 中走 Greedy 特殊路径；本图不是所有 sampler kernel 的精确调用顺序。</text>
</svg>
